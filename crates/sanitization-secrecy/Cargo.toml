[package]
name = "sanitization-secrecy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Migration-compatible secrecy-style wrappers backed by sanitization."
license.workspace = true
readme = "README.md"
documentation = "https://docs.rs/sanitization-secrecy"
repository.workspace = true
keywords = ["secrets", "security", "secrecy", "zeroize", "no-std"]
categories = ["cryptography", "memory-management", "no-std"]
include = [
    "Cargo.toml",
    "src/**/*.rs",
    "README.md",
]

[package.metadata.sanitization]
role = "companion"
clearing-owner = "sanitization"

[features]
default = ["zeroize-interop"]
hazmat-unrestricted-exposure = []
serde = ["dep:serde"]
serde-compat-unbounded = ["serde"]
zeroize-interop = ["dep:zeroize"]

[dependencies]
sanitization = { version = "2.1.1", path = "../sanitization", default-features = false, features = ["alloc"] }
serde = { version = "1.0.229", default-features = false, features = ["alloc"], optional = true }
zeroize = { version = "1", default-features = false, features = ["alloc"], optional = true }

[dev-dependencies]
serde_json = "1"

[package.metadata.docs.rs]
all-features = true

[lib]
path = "src/lib.rs"
